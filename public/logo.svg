<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%" role="img" aria-label="EmptyLeg India logo" style="font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;">
  <defs>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#c8a96e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Subtle gold arc suggesting flight path / open wing -->
  <path d="M 18 42 Q 55 14 110 28 T 220 36" fill="none" stroke="#c8a96e" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <path d="M 28 44 Q 65 22 105 32 T 210 38" fill="none" stroke="#c8a96e" stroke-width="0.75" stroke-linecap="round" opacity="0.4"/>

  <!-- Wing / aircraft icon in champagne gold -->
  <g filter="url(#goldGlow)">
    <!-- Stylized left wing -->
    <path d="M 24 36 L 42 22 L 56 28 L 48 36 Z" fill="#c8a96e" opacity="0.92"/>
    <path d="M 42 22 L 52 16 L 58 22 L 48 28 Z" fill="#c8a96e" opacity="0.85"/>
    <!-- Fuselage / body -->
    <ellipse cx="72" cy="34" rx="10" ry="3.5" fill="#0b1628" opacity="0.95"/>
    <!-- Tail -->
    <path d="M 82 32 L 88 26 L 90 32 Z" fill="#c8a96e" opacity="0.95"/>
    <!-- Right wing -->
    <path d="M 82 34 L 100 24 L 112 30 L 102 38 Z" fill="#c8a96e" opacity="0.92"/>
    <path d="M 100 24 L 110 20 L 116 26 L 108 32 Z" fill="#c8a96e" opacity="0.85"/>
  </g>

  <!-- Brand wordmark -->
  <text x="128" y="28" font-size="22" font-weight="600" letter-spacing="1.5" fill="#0b1628" style="font-family: 'Cormorant Garamond', Georgia, serif;">EmptyLeg</text>
  <text x="128" y="42" font-size="9" font-weight="700" letter-spacing="5.5" fill="#c8a96e" style="font-family: 'DM Sans', sans-serif;">INDIA</text>

  <!-- Small gold underline beneath wordmark -->
  <line x1="128" y1="46" x2="198" y2="46" stroke="#c8a96e" stroke-width="0.5" opacity="0.7"/>
</svg>
