name: CI/CD

on:
  push:
    branches: [master, main, fix/ci-production-readiness]
  pull_request:
    branches: [master, main]

jobs:
  cloudflare-gate:
    # Detects whether Cloudflare deploy credentials exist, at step level
    # (secrets/env are not usable in job-level `if` expressions).
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials present"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials absent - deploy jobs will be skipped"
          fi

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit

  migration-check:
    # Applies the tracked Supabase migrations + seed to an EPHEMERAL LOCAL
    # stack — validates migration ordering/schema without touching any
    # cloud/production database and without requiring Supabase credentials.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Assert migrations exist
        run: test -f supabase/migrations/001_initial_schema_v2.sql && test -f supabase/seed.sql
      - name: Start local Supabase stack (applies migrations + seed)
        run: supabase start --debug
      - name: Verify schema applied
        run: |
          supabase status
          supabase status -o env | grep -q '^ANON_KEY='

  local-stack-tests:
    # Runs the Playwright suite (API, frontend, security) against the same
    # ephemeral local Supabase stack. Read-mostly; enquiries created during
    # the run live only in this disposable container.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start local Supabase stack (applies migrations + seed)
        run: supabase start
      - name: Export local stack configuration for tests
        run: |
          # `supabase status -o env` emits API_URL=<gateway root>. Tests speak
          # PostgREST, so they need the /rest/v1 path; the frontend speaks the
          # gateway root (/functions/v1/...).
          supabase status -o env > /tmp/sb_env
          GATEWAY_ROOT=$(grep '^API_URL=' /tmp/sb_env | cut -d= -f2 | tr -d '"' | sed 's|/*$||')
          ANON_KEY=$(grep '^ANON_KEY=' /tmp/sb_env | cut -d= -f2 | tr -d '"')
          SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' /tmp/sb_env | cut -d= -f2 | tr -d '"')
          {
            echo "SUPABASE_URL=${GATEWAY_ROOT}/rest/v1"
            echo "SUPABASE_GATEWAY_URL=${GATEWAY_ROOT}"
            echo "ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "KONG_URL=$GATEWAY_ROOT"
          } >> "$GITHUB_ENV"
          # ANON_KEY is itself the anon JWT in the local stack (same value);
          # exporting it as ANON_JWT lets the Bearer-authenticated privacy
          # tests actually execute instead of silently skipping.
          echo "ANON_JWT=$ANON_KEY" >> "$GITHUB_ENV"
      - name: Write frontend runtime config (config.local.js)
        run: |
          # index.html loads config.local.js before config.js; this binds the
          # frontend to the disposable local stack only.
          cat > public/config.local.js <<EOF
          window.__ENV_LOCAL__ = {
            SUPABASE_URL: '${SUPABASE_GATEWAY_URL}',
            SUPABASE_ANON_KEY: '${ANON_KEY}',
            ALLOW_DEV_DEFAULTS: 'true'
          };
          EOF
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Serve frontend
        run: |
          npx serve public -l 5173 &
          sleep 5
      - name: API tests
        run: npx playwright test tests/api.spec.ts --reporter=line
      - name: Frontend tests
        run: npx playwright test tests/frontend.spec.ts --reporter=line
      - name: Security tests
        run: npx playwright test tests/security.spec.ts --reporter=line
      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup || true

  deploy-preview:
    needs: [cloudflare-gate, lint-and-typecheck, migration-check]
    runs-on: ubuntu-latest
    if: needs.cloudflare-gate.outputs.ready == 'true' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: emptyleg-preview
          directory: public
          branch: preview-${{ github.event.number }}

  deploy-production:
    needs: [cloudflare-gate, lint-and-typecheck, migration-check, local-stack-tests]
    runs-on: ubuntu-latest
    # Human approval gate: requires a configured `production` environment with
    # a reviewer requirement. While that environment does not exist this job
    # fails fast instead of silently deploying.
    if: >-
      needs.cloudflare-gate.outputs.ready == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: emptyleg
          directory: public
          branch: main
