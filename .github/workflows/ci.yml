name: CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit

  migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - run: supabase migration list
      - run: supabase db push --dry-run

  api-tests:
    runs-on: ubuntu-latest
    if: env.ANON_KEY != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/api.spec.ts --reporter=line
        env:
          ANON_KEY: ${{ secrets.ANON_KEY }}
          ANON_JWT: ${{ secrets.ANON_JWT }}

  frontend-tests:
    runs-on: ubuntu-latest
    if: env.ANON_KEY != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Start frontend preview server
      - run: npx serve public -l 5173 &
      - run: sleep 5
      - run: npx playwright test tests/frontend.spec.ts --reporter=line
        env:
          ANON_KEY: ${{ secrets.ANON_KEY }}
          ANON_JWT: ${{ secrets.ANON_JWT }}

  security-tests:
    runs-on: ubuntu-latest
    if: env.ANON_KEY != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/security.spec.ts --reporter=line
        env:
          ANON_KEY: ${{ secrets.ANON_KEY }}
          ANON_JWT: ${{ secrets.ANON_JWT }}

  deploy-preview:
    needs: [lint-and-typecheck, migration-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: emptyleg-preview
          directory: public
          branch: preview-${{ github.event.number }}

  deploy-production:
    needs: [lint-and-typecheck, migration-check, api-tests, frontend-tests, security-tests]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: emptyleg
          directory: public
          branch: main