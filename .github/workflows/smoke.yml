name: Critical Smoke Tests
on:
  push:
    branches: [master, main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Marketplace
        run: curl -s -o /dev/null -w "%{http_code}" https://master.emptyleg-india.pages.dev/marketplace/ | grep -q "200"
      - name: Test Agent Dashboard
        run: curl -s -o /dev/null -w "%{http_code}" https://master.emptyleg-india.pages.dev/agent-dashboard.html | grep -q "200"
      - name: Test Admin
        run: curl -s -o /dev/null -w "%{http_code}" https://master.emptyleg-india.pages.dev/admin | grep -q "200"
      - name: Test Agent 1
        run: curl -s -X POST -H "Content-Type: application/json" -d '{"action":"scan"}' https://mfijofonuggcxqlftgtl.supabase.co/functions/v1/agent-1-lead-generation | grep -q "success"
